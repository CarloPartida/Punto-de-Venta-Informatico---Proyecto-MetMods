<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartera de Clientes</title>
    <link rel="stylesheet" href="CarCStyles/CarC.css">
    <link rel="stylesheet" href="CarCStyles/NuEd.css">
</head>
<body>
    <main class="contenedor-principal">
        <h2 class="titulo-modulo">Carteras de Clientes</h2>

        <section class="cartClientes">
            <table>
                <thead>
                    <tr>
                        <th>No. del Cliente</th>
                        <th>Nombre del referente</th>
                        <th>Telefono</th>
                        <th>Localidad</th>
                        <th class="col-accion-header">
                            <button type="button" id="btn-agregar" class="btn-agregar">+</button>
                        </th>
                    </tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
            <div id="aviso"></div>
        </section>
    </main>

    <!-- Modal contenedor para NuEd.html -->
    <dialog id="modal-contenedor">
        <div id="modal-caja"></div>
    </dialog>

    <script src="CarCScripts/NuEd.js"></script>
    <script src="CarCScripts/CarC.js"></script>
</body>
</html>
