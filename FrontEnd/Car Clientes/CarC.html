<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartera de Clientes</title>
    <link rel="stylesheet" href="CarCStyles/CarC.css">
</head>
<body>
    <div class="cartClientes">
        <header>
            <h1>Carteras de Clientes</h1>
        </header>
        <!-- Tabla con el listado de clientes -->
        <table>
            <thead>
                <tr>
                    <th colspan="1">No. del Cliente</th>
                    <th colspan="4">Nombre del referente</th>
                    <th colspan="2">Teléfono</th>
                    <th colspan="3">Localidad</th>
                    <th colspan="1"style="border: 0px; background-color: transparent">
                        <button type="button" id="btn-agregar">+</button>
                    </th>
                </tr>
            </thead>
            <tbody>
                <!-- Fila con data-id y clase btn-editar agregados -->
                <tr data-id="1">
                    <td colspan="1">1</td>
                    <td colspan="4">Mart Perez SixSv.</td>
                    <td colspan="2">123456789</td>
                    <td colspan="3">Lomas de Mart</td>
                    <td colspan="1">
                        <button type="button" class="btn-editar">&#9998</button>
                        <button type="button" class="btn-eliminar">&#128465</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="1">&nbsp;</td>
                    <td colspan="4"></td>
                    <td colspan="2"></td>
                    <td colspan="3"></td>
                    <td colspan="1">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="CarCScripts/CarC.js"></script>
</body>
</html>
