<div class="NueEd">
    <h3 id="modal-titulo">Nuevo/Editar Cliente</h3>
    <nav>
        <h3>Registra un nuevo o edita un Cliente</h3>
    </nav>

    <p id="mensaje-error-modal" class="mensaje-error" hidden></p>

    <form id="form-cliente">
        <div class="campo-grupo">
            <label for="cliente-nombre">Nombre.</label>
            <input type="text" id="cliente-nombre" name="nombre" required autocomplete="off">
        </div>

        <div class="campo-grupo">
            <label for="cliente-edad">Edad.</label>
            <input type="number" id="cliente-edad" name="edad" min="0" max="120">
        </div>

        <div class="campo-grupo">
            <label for="cliente-telefono">Teléfono.</label>
            <input type="tel" id="cliente-telefono" name="telefono">
        </div>

        <div class="campo-grupo">
            <label for="cliente-localidad">Localidad.</label>
            <input type="text" id="cliente-localidad" name="localidad">
        </div>

        <div class="acciones-modal">
            <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
            <button type="submit" id="btn-guardar" class="btn-confirmar">Confirmar</button>
        </div>
    </form>
</div>
