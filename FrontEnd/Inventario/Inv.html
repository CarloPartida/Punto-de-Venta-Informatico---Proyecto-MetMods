<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="InvStyles/Inv.css">
    <link rel="stylesheet" href="InvStyles/NuEdInv.css">
</head>
<body>
    <main class="contenedor-principal">
        <h2 class="titulo-modulo">Inventario</h2>

        <section class="cartInventario">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Disponibilidad</th>
                        <th>Código del Prod.</th>
                        <th>Cod. Sat</th>
                        <th class="col-accion-header">
                            <button type="button" id="btn-agregar" class="btn-agregar">+</button>
                        </th>
                    </tr>
                </thead>
                <tbody id="lista-productos"></tbody>
            </table>
            <div id="aviso" role="status"></div>
        </section>
    </main>

    <!-- Modal contenedor que recibe NuEdInv -->
    <dialog id="modal-contenedor">
        <div id="modal-caja"></div>
    </dialog>

    <script src="InvScripts/NuEdInv.js"></script>
    <script src="InvScripts/Inv.js"></script>
</body>
</html>
