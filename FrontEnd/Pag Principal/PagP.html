<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href="PagPStyles/PagP.css">
    <link rel="stylesheet" href="PagPStyles/Perfil.css">
    <link rel="stylesheet" href="PagPStyles/modalServicios.css">
    <link rel="stylesheet" href="PagPStyles/modalVentas.css">
</head>
<body>

    <main class="contenedor-principal">
        <!-- Encabezado y Navegación -->
        <nav class="barra-navegacion">
            <h1>Pagina Principal</h1>

            <table class="TablaNav">
                <tr>
                    <td>
                        <div class="contenedor-menu-perfil">
                            <button type="button" id="btn-menu" class="btn-menu">&#8942;</button>
                            <div id="contenedor-perfil"></div>
                        </div>
                    </td>
                    <td>
                        <button type="button" id="btn-cartera" class="btn-ovalado">Cartera de Clientes</button>
                    </td>
                    <td>
                        <button type="button" id="btn-inventario" class="btn-ovalado">Inventario</button>                        
                    </td>
                    <td>
                        <button type="button" id="btn-proveedores" class="btn-ovalado">Proveedores</button>
                    </td>
                    <td>
                        <button type="button" id="btn-soporte" class="btn-ovalado">Soporte</button>
                    </td>
                    <td>
                        <button type="button" id="btn-agregar" class="btn-agregar">+</button>
                    </td>
                </tr>
            </table>
        </nav>

        <!-- Sección de Servicios Pendientes -->
        <section class="seccion-servicios">
            <table class="TablaSec">
                <thead>
                    <tr>
                        <td colspan="6">
                            <h2>Servicios Pendientes.</h2>
                        </td>
                    </tr>
                    <tr>
                        <td><h2>ID</h2></td>
                        <td><h2>Nombre</h2></td>
                        <td><h2>Equipo</h2></td>
                        <td><h2>Fecha</h2></td>
                        <td colspan="2"><h2>Acciones</h2></td>
                    </tr>
                </thead>
                <!-- Contenedor dinámico de servicios -->
                <tbody id="lista-servicios"></tbody>
            </table>
            <!-- Mensaje de estado -->
            <div id="aviso"></div>
        </section>
    </main>

    <dialog id="modal-contenedor" class="modal-overlay">
        <div class="modal-caja" id="modal-caja"></div>
    </dialog>

    <!-- Inclusión de scripts -->
    <script src="PagPScripts/facturaPDF.js"></script>
    <script src="PagPScripts/modalVentas.js"></script>
    <script src="PagPScripts/modalServicios.js"></script>
    <script src="PagPScripts/Perfil.js"></script>
    <script src="PagPScripts/PagP.js"></script>
</body>
</html>
