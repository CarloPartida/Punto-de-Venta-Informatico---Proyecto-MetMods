<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - Sistema de Gestión</title>

    <!-- [TABLER] Estilos principales del framework -->
    <link rel="stylesheet" href="../assets/css/tabler.min.css">

</head>
<body class="theme-dark">

    <!-- [TABLER] Contenedor principal de la página -->
    <div class="page">

<!-- [TABLER] Barra de navegación superior -->
        <header class="navbar navbar-expand-md d-print-none mb-3">
            <div class="container-xl">
                <!-- [TABLER] Botón desplegable para celular -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <h1 class="navbar-brand me-auto me-md-4">
                    <span class="text-primary fw-bold">Sistema de Gestión</span>
                </h1>

                <!-- [TABLER] Contenedor relativo a la derecha para desplegar el perfil hacia la izquierda -->
                <div class="position-relative order-md-last">
                    <button type="button" id="btn-menu" class="btn btn-icon btn-ghost-secondary" aria-label="Menú de perfil">&#8942;</button>
                    <div id="contenedor-perfil"></div>
                </div>

                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="navbar-nav">
                        <li class="nav-item active fw-bold">
                            <span class="nav-link">Página Principal</span>
                        </li>
                        <li class="nav-item">
                            <button type="button" id="btn-inventario" class="nav-link btn btn-link">Inventario</button>
                        </li>
                        <li class="nav-item">
                            <button type="button" id="btn-proveedores" class="nav-link btn btn-link">Proveedores</button>
                        </li>
                        <li class="nav-item">
                            <button type="button" id="btn-cartera" class="nav-link btn btn-link">Cartera de Clientes</button>
                        </li>
                        <li class="nav-item">
                            <button type="button" id="btn-soporte" class="nav-link btn btn-link">Soporte</button>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- [TABLER] Cuerpo principal de la vista -->
        <div class="page-wrapper">
            <div class="container-xl">

                <!-- [TABLER] Tarjeta contenedora de la tabla -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title">Servicios Pendientes</h3>
                        <button type="button" id="btn-agregar" class="btn btn-primary">+ Agregar</button>
                    </div>

                    <!-- [TABLER] Tabla responsiva integrada a la tarjeta -->
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Equipo</th>
                                    <th>Fecha</th>
                                    <th colspan="2" class="w-1 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="lista-servicios"></tbody>
                        </table>
                    </div>
                </div>

                <div id="aviso" class="mt-2 text-muted" role="status"></div>
            </div>
        </div>
    </div>

    <dialog id="modal-contenedor">
        <div id="modal-caja"></div>
    </dialog>

    <!-- Modal independiente para Registro de Auditoría -->
    <dialog id="modal-auditoria-contenedor" class="border-0 rounded-3 shadow-lg p-0 bg-body text-body" style="width: 95%; max-width: 32rem;">
        <div id="modal-auditoria-caja" class="p-4"></div>
    </dialog>

    <!-- [TABLER] Scripts interactivos del framework -->
    <script src="../assets/js/tabler.min.js"></script>
    <script src="PagPScripts/facturaPDF.js"></script>
    <script src="PagPScripts/modalVentas.js"></script>
    <script src="PagPScripts/modalServicios.js"></script>
    <script src="PagPScripts/Perfil.js"></script>
    <script src="PagPScripts/PagP.js"></script>
    <script src="../Reg Auditoria/scripts/RegA.js"></script>
</body>
</html>
