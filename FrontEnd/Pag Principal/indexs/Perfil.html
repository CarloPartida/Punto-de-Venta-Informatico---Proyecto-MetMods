<!-- [TABLER] Tarjeta flotante oculta por defecto y desplegada hacia la izquierda -->
<div id="panel-perfil" class="card position-absolute mt-2 shadow-lg" style="display: none; width: 18rem; top: 100%; right: 0; z-index: 1050;">
    <!-- [TABLER] Cabecera con avatar e información del usuario -->
    <div class="card-body d-flex align-items-center gap-3 pb-2">
        <img src="OSSS.png" alt="Foto de perfil" class="avatar avatar-md rounded-circle">
        <div class="text-truncate">
            <h3 id="perfil-usuario" class="card-title mb-0 text-truncate">Usuario</h3>
            <div id="perfil-correo" class="text-secondary small text-truncate">Correo</div>
        </div>
    </div>

    <!-- [TABLER] Botones apilados en columna -->
    <div class="card-body pt-2 d-grid gap-2">
        <button type="button" class="btn btn-outline-primary btn-sm w-100">Registro de Auditoría</button>
        <button type="button" class="btn btn-outline-primary btn-sm w-100">Cambiar datos de Soporte</button>
        <hr class="my-1">
        <button type="button" id="btn-cerrar-sesion" class="btn btn-outline-danger btn-sm w-100">Cerrar Sesión</button>
    </div>
</div>
