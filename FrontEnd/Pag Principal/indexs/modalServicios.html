<div id="panel-servicio">
    <!-- [TABLER] Encabezado del modal con botón de cierre -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom">
        <h3 class="modal-title m-0">Nuevo Servicio / Editar</h3>
        <button type="button" class="btn-close" aria-label="Cerrar" onclick="ModalServicios.cerrar()"></button>
    </div>

    <!-- [TABLER] Alerta dinámica para mensajes de error -->
    <div id="mensaje-error" class="alert alert-danger" role="alert" hidden></div>

    <form id="form-servicio" action="/api/servicios" method="POST">
        <div class="mb-3">
            <label for="equipo" class="form-label">Equipo</label>
            <input type="text" id="equipo" name="equipo" class="form-control">
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción del servicio</label>
            <input type="text" id="descripcion" name="descripcion" class="form-control">
        </div>

        <div class="mb-3">
            <label for="observaciones" class="form-label">Observaciones</label>
            <input type="text" id="observaciones" name="observaciones" class="form-control">
        </div>

        <!-- [TABLER] Bloque agrupado para datos del cliente -->
        <fieldset class="form-fieldset mt-3">
            <legend class="fs-4 fw-semibold mb-2">Datos del Cliente</legend>

            <div class="row g-2">
                <div class="col-12 col-sm-6">
                    <label for="cliente-nombre" class="form-label">Nombre</label>
                    <input type="text" id="cliente-nombre" name="cliente_nombre" class="form-control" list="lista-clientes">
                </div>

                <div class="col-4 col-sm-2">
                    <label for="cliente-edad" class="form-label">Edad</label>
                    <input type="number" id="cliente-edad" name="cliente_edad" class="form-control">
                </div>

                <div class="col-8 col-sm-4">
                    <label for="cliente-telefono" class="form-label">Teléfono</label>
                    <input type="tel" id="cliente-telefono" name="cliente_telefono" class="form-control">
                </div>
            </div>
        </fieldset>

        <!-- [TABLER] Interruptor para desplegar el panel de ventas -->
        <div class="mt-3">
            <label class="form-check form-switch">
                <input type="checkbox" id="chk-venta" name="chk_venta" class="form-check-input">
                <span class="form-check-label fw-medium">Venta</span>
            </label>
        </div>
    </form>
</div>
