<!-- Panel de la tabla de productos y total -->
<div id="panel-venta" class="panel-modal" hidden>
    <table class="tabla-ventas">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Piezas</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-ventas-body">
            <!-- Fila 1 -->
            <tr>
                <td><input type="text" placeholder="Producto" class="input-prod" list="lista-productos"></td>
                <td><input type="text" placeholder="$0 MXN" class="input-precio"></td>
                <td><span class="cant-piezas">0</span></td>
                <td class="col-botones">
                    <button type="button" class="btn-cant btn-mas">+</button>
                    <button type="button" class="btn-cant btn-menos">-</button>
                </td>
            </tr>
            <!-- Fila 2 -->
            <tr>
                <td><input type="text" placeholder="Producto" class="input-prod" list="lista-productos"></td>
                <td><input type="text" placeholder="$0 MXN" class="input-precio"></td>
                <td><span class="cant-piezas">0</span></td>
                <td class="col-botones">
                    <button type="button" class="btn-cant btn-mas">+</button>
                    <button type="button" class="btn-cant btn-menos">-</button>
                </td>
            </tr>
            <!-- Fila 3 -->
            <tr>
                <td><input type="text" placeholder="Producto" class="input-prod" list="lista-productos"></td>
                <td><input type="text" placeholder="$0 MXN" class="input-precio"></td>
                <td><span class="cant-piezas">0</span></td>
                <td class="col-botones">
                    <button type="button" class="btn-cant btn-mas">+</button>
                    <button type="button" class="btn-cant btn-menos">-</button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="campo-total">
        <label for="costo-total">Costo Total.</label>
        <input type="text" id="costo-total" placeholder="$0.00">
    </div>
</div>

<!-- Botones de Acción del Modal -->
<table class="tabla-acciones-venta">
    <tr>
        <td colspan="3"><button type="button" id="btn-factura">Generar Factura</button></td>
        <td colspan="2"><button type="submit" form="form-servicio" id="btn-guardar">Guardar</button></td>
    </tr>
</table>
