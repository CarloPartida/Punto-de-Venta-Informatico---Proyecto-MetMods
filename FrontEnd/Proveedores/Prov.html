<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Sistema de Gestión</title>
    <!-- [TABLER] Estilos principales del framework -->
    <link rel="stylesheet" href="../assets/css/tabler.min.css">

</head>
<body class="theme-dark">
    <!-- [TABLER] Contenedor principal de la página -->
    <div class="page">
        <!-- [TABLER] Barra de navegación superior -->
        <header class="navbar navbar-expand-md d-print-none mb-3">
            <div class="container-xl">
                <!-- [TABLER] Botón desplegable para ventanas chicas -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <h1 class="navbar-brand me-4">
                    <span class="text-primary fw-bold">Sistema de Gestión</span>
                </h1>

                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="../Pag Principal/PagP.html" class="nav-link">Página Principal</a>
                        </li>
                        <li class="nav-item">
                            <a href="../Inventario/Inv.html" class="nav-link">Inventario</a>
                        </li>
                        <li class="nav-item active fw-bold">
                            <a href="Prov.html" class="nav-link">Proveedores</a>
                        </li>
                        <li class="nav-item">
                            <a href="../Car Clientes/CarC.html" class="nav-link">Cartera de Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a href="../Soporte/Soporte.html" class="nav-link">Soporte</a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- [TABLER] Cuerpo principal de la vista -->
        <div class="page-wrapper">
            <div class="container-xl">
                <!-- [TABLER] Tarjeta contenedora de la tabla -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title">Proveedores</h3>
                        <button type="button" id="btn-agregar" class="btn btn-primary">+ Agregar</button>
                    </div>

                    <!-- [TABLER] Tabla responsiva integrada a la tarjeta -->
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table table-hover">
                            <thead>
                                <tr>
                                    <th>Nombre del Proveedor</th>
                                    <th>Teléfono</th>
                                    <th>Localidad</th>
                                    <th>Num. de Cliente</th>
                                    <th class="w-1 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="lista-proveedores"></tbody>
                        </table>
                    </div>
                </div>

                <div id="aviso" class="mt-2 text-secondary" role="status"></div>
            </div>
        </div>
    </div>

    <dialog id="modal-contenedor" class="border-0 rounded-3 shadow-lg p-0 bg-body text-body" style="width: 95%; max-width: 36rem;">
        <div id="modal-caja" class="p-4"></div>
    </dialog>

    <!-- [TABLER] Scripts interactivos del framework -->
    <script src="../assets/js/tabler.min.js"></script>
    <script src="scripts/NuEdProv.js"></script>
    <script src="scripts/Prov.js"></script>
