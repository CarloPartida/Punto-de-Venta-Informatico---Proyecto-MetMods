<div>
    <!-- [TABLER] Encabezado del modal -->
    <div class="d-flex justify-content-between align-items-start pb-3 mb-3 border-bottom">
        <div>
            <h3 id="modal-titulo" class="modal-title m-0">Nuevo / Editar Proveedor</h3>
            <div class="text-secondary small">Registra un nuevo o edita un proveedor</div>
        </div>
        <button type="button" class="btn-close" aria-label="Cerrar" onclick="window.NuEdProv.cerrar()"></button>
    </div>

    <!-- [TABLER] Alerta dinámica de errores -->
    <div id="mensaje-error-modal" class="alert alert-danger" role="alert" hidden></div>

    <form id="form-proveedor">
        <div class="mb-3">
            <label for="prov-nombre" class="form-label required">Nombre del Proveedor</label>
            <input type="text" id="prov-nombre" name="nombre" class="form-control" required maxlength="100" autocomplete="off">
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
                <label for="prov-telefono" class="form-label">Teléfono</label>
                <input type="text" id="prov-telefono" name="telefono" class="form-control" maxlength="20" autocomplete="off">
            </div>

            <div class="col-12 col-sm-6">
                <label for="prov-num-cliente" class="form-label">Num. Cliente</label>
                <input type="text" id="prov-num-cliente" name="num_cliente" class="form-control" maxlength="50" autocomplete="off">
            </div>
        </div>

        <div class="mb-3">
            <label for="prov-localidad" class="form-label">Localidad</label>
            <input type="text" id="prov-localidad" name="localidad" class="form-control" maxlength="100" autocomplete="off">
        </div>

        <!-- [TABLER] Botones de acción al pie del modal -->
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <button type="button" id="btn-cancelar" class="btn btn-outline-secondary">Cancelar</button>
            <button type="submit" id="btn-guardar" class="btn btn-primary">Confirmar</button>
        </div>
    </form>
</div>
