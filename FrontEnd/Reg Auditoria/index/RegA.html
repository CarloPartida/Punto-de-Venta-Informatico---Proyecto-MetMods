<div id="panel-auditoria">
    <!-- [TABLER] Encabezado del modal -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom">
        <h3 class="modal-title m-0">Registro de Auditoría</h3>
        <button type="button" id="btn-cerrar-auditoria" class="btn-close" aria-label="Cerrar"></button>
    </div>

    <!-- [TABLER] Caja contenedora con scroll para la lista de modificaciones (solo lectura).
         tabindex="0" permite enfocarla con Tab y recorrerla con las flechas, Re Pág, Av Pág, Inicio y Fin (RQNF 31) -->
    <div id="lista-auditoria" role="list" tabindex="0" aria-label="Historial de modificaciones"
         class="border rounded-3 p-3 bg-body-tertiary d-flex flex-column gap-3" style="max-height: 24rem; overflow-y: auto;">
    </div>

    <!-- Mensajes de carga, lista vacía o error -->
    <div id="estado-auditoria" role="status" aria-live="polite" class="small text-secondary text-center mt-2"></div>

    <!-- Carga la siguiente página del historial -->
    <button type="button" id="btn-mas-auditoria" class="btn btn-outline-primary btn-sm w-100 mt-2" hidden>Cargar más</button>
</div>
