<!DOCTYPE html>
<html lang="es">
<head>

    <title>Soporte</title>
    <link rel="stylesheet" href="styles/Soporte.css">

<body>

    <main class="contenedor-principal">
        <h2 class="titulo-modulo">Soporte</h2>

        <!-- Barra de navegación para móvil/tableta -->

        <section class="cartSoporte">

                        <th>Nombre</th>
