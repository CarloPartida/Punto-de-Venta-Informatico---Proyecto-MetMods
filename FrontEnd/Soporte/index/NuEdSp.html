<dialog id="dialog-soporte">
    <link rel="stylesheet" href="../styles/NuEdSp.css">

    <h3 id="modal-titulo">Nuevo / Editar Soporte</h3>
    <nav>
        <h3>Registra un nuevo o edita un Soporte</h3>
    </nav>

    <p id="mensaje-error-modal" class="mensaje-error" hidden></p>

    <form id="form-soporte" action="/api/soporte" method="POST">
        <div class="campo-grupo">
            <label for="soporte-nombre">Nombre.</label>
            <input type="text" id="soporte-nombre" name="nombre" required>
        </div>

        <div class="campo-grupo">
            <label for="soporte-edad">Edad.</label>
            <input type="number" id="soporte-edad" name="edad">
        </div>

        <div class="campo-grupo">
            <label for="soporte-telefono">Teléfono.</label>
            <input type="tel" id="soporte-telefono" name="telefono">
        </div>

        <div class="campo-grupo">
            <label for="soporte-localidad">Localidad.</label>
            <input type="text" id="soporte-localidad" name="localidad">
        </div>

        <div class="campo-grupo">
            <button type="button" id="btn-deshacer" class="btn-deshacer">Deshacer</button>
            <button type="submit" id="btn-confirmar" class="btn-confirmar">Confirmar</button>
        </div>
    </form>
</dialog>
